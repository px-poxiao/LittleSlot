# LittleSlot 公共后端浏览器文案 / Public-backend browser messages
# 复制此文件后通过 LITTLESLOT_BACKEND_MESSAGES_FILE 指向副本，重启后端生效。
# Copy this file, set LITTLESLOT_BACKEND_MESSAGES_FILE to the copy, then restart the backend.
# API 的 error/status 字段是机器协议，不受这里的翻译影响。
# API error/status fields are machine protocol values and are not translated here.

# 用户拒绝授权后，浏览器显示的文字；无占位符。
# Browser text after the user denies authorization; no placeholders.
cancelled=授权已取消，可以返回游戏。

# 后端已取得完整 UID 和 UUID 列表并结算后，浏览器显示的文字；无占位符。
# Browser text after a complete UID/UUID result is stored and billed; no placeholders.
completed=授权完成，可以返回游戏。
